apiVersion: v2
name: callpay
description: CallPay - AI phone agent that takes orders, collects PayPal payments on the call and pays the crew.
type: application
version: 0.2.0
appVersion: "0.2.0"
# Stateful infrastructure comes from well-known charts; each can be turned off to use a managed service instead.
dependencies:
  - name: postgresql
    version: "16.x.x"
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: postgresql.enabled
  - name: redis
    version: "20.x.x"
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: redis.enabled
  - name: kafka
    version: "31.x.x"
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: kafka.enabled
  - name: clickhouse
    version: "7.x.x"
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: clickhouse.enabled
  - name: temporal
    version: "0.52.x"
    repository: https://go.temporal.io/helm-charts
    condition: temporal.enabled
