# Render Blueprint: the public demo on Render's free plan.
# One web service (root Dockerfile) serves the dashboard and the API on the same URL, plus a free Postgres.
# The full stack (Kafka, Flink, ClickHouse, Temporal) runs with docker-compose or the Helm chart; here the API
# uses its built-in fallbacks: in-memory events, in-process workflows, analytics from Postgres.
services:
  - type: web
    name: callpay
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: callpay-db, property: connectionString }
      - key: PAYPAL_ENV
        value: sandbox
      # APP_URL is not needed: the launcher derives it from Render's RENDER_EXTERNAL_URL.
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID # add after registering <url>/api/webhooks/paypal in the PayPal sandbox app
        sync: false
      - key: CREW_EMAILS # comma-separated sandbox personal accounts that receive crew payouts
        sync: false
      # Optional: any one of these gives natural replies; without them the rules engine answers.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: FULFIL_SECONDS
        value: "20"

databases:
  - name: callpay-db
    plan: free
    databaseName: callpay
