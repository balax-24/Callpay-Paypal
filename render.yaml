# Render Blueprint: public demo (API + dashboard + Postgres).
# The full stack (Kafka, Flink, ClickHouse, Temporal) runs on k3s via infra/helm; on Render the API
# uses its built-in fallbacks: in-memory events, in-process workflows, analytics from Postgres.
services:
  - type: web
    name: callpay-api
    runtime: docker
    rootDir: services/api
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: callpay-db, property: connectionString }
      - key: KAFKA_BOOTSTRAP
        value: ""
      - key: PAYPAL_ENV
        value: sandbox
      - key: APP_URL
        sync: false # e.g. https://callpay-api.onrender.com
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: PROVIDERS_LLM
        value: claude,openai,gemini
      - key: FULFIL_SECONDS
        value: "20"
  - type: web
    name: callpay-web
    runtime: docker
    rootDir: apps/web
    dockerfilePath: ./Dockerfile
    plan: starter
    # NEXT_PUBLIC_* is embedded in the browser bundle by Next.js at build time.
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: callpay-api
          property: host

databases:
  - name: callpay-db
    plan: basic-256mb
    databaseName: callpay
